<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Monogramm-Generator</title>
<style>
  :root {
    --bg: #0A0B12; --ink: #F3F4FB; --muted: #9BA0BE; --faint: #565C82; --line: rgba(255,255,255,0.12);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(130% 100% at 50% -10%, #14172a, var(--bg) 62%); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .brand b { background: linear-gradient(100deg,#38E0FF,#B36BFF,#FFC24B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .back { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 40px; padding: 9px 15px; text-decoration: none; transition: .2s; }
  .back:hover { color: var(--ink); border-color: #38E0FF; }

  .main { flex: 1; display: grid; place-items: center; padding: 8px 16px 24px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; width: min(560px, 96vw); }
  .head { text-align: center; }
  .head .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: #38E0FF; margin-bottom: 8px; }
  .head h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 800; letter-spacing: -0.02em; }
  .head p { color: var(--muted); font-size: 15px; margin-top: 8px; }

  .badge { width: min(340px, 78vw); aspect-ratio: 1; display: grid; place-items: center; }
  .badge svg { width: 100%; height: 100%; }

  .controls { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .field input { width: 100%; text-align: center; text-transform: uppercase; font-weight: 800; font-size: 26px; letter-spacing: 0.1em;
    color: var(--ink); background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 14px; padding: 14px; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: #38E0FF; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .chip { font-family: var(--mono); font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.045); border: 1px solid var(--line); border-radius: 30px; padding: 8px 14px; cursor: pointer; transition: .18s; }
  .chip:hover { color: var(--ink); }
  .chip.on { color: #06060F; background: linear-gradient(100deg,#38E0FF,#B36BFF); border-color: transparent; font-weight: 700; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .btn { font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 40px; padding: 12px 18px; cursor: pointer; transition: .2s; }
  .btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.28); }
  .btn.primary { color: #06060F; background: linear-gradient(100deg,#38E0FF,#B36BFF); border: none; font-weight: 700; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: center; min-height: 14px; }
  .follow { text-align: center; padding: 0 0 26px; }
  .follow a { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 40px; padding: 11px 18px; transition: .2s; }
  .follow a:hover { color: var(--ink); border-color: #B36BFF; }

  /* badge self-draw animation */
  .anim .ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.15s ease forwards; }
  .anim .letters { opacity: 0; animation: appear 0.7s ease 0.6s forwards; }
  .anim .dot { opacity: 0; animation: appear 0.5s ease 1.1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes appear { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .anim .ring, .anim .letters, .anim .dot { animation: none; stroke-dashoffset: 0; opacity: 1; } }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">khan<b>motari</b></div>
    <a class="back" href="../index.html">‹ Zurück</a>
  </div>

  <div class="main">
    <div class="stage">
      <div class="head">
        <div class="label">Monogramm-Generator</div>
        <h1>Dein eigenes Logo aus deinen Initialen</h1>
        <p>Tipp deine Initialen, wähl Stil & Form — und lad dein Monogramm als PNG oder SVG.</p>
      </div>

      <div class="badge" id="badge"></div>

      <div class="controls">
        <div class="field"><input id="txt" type="text" maxlength="3" value="KM" placeholder="Initialen" autocomplete="off" spellcheck="false"></div>
        <div class="row"><span class="cap">Stil</span><div id="styles" class="row"></div></div>
        <div class="row"><span class="cap">Form</span><div id="shapes" class="row"></div></div>
        <div class="actions">
          <button id="replay" class="btn">↻ Neu zeichnen</button>
          <button id="svg" class="btn">SVG</button>
          <button id="png" class="btn primary">↓ PNG speichern</button>
        </div>
        <div class="status" id="status">Dein Logo — kostenlos, ohne Wasserzeichen, bereit zum Einsatz.</div>
      </div>
    </div>
  </div>

  <div class="follow"><a href="../index.html#connect">khanmotari folgen ›</a></div>

<script>
(function () {
  "use strict";
  const badge = document.getElementById("badge");
  const status = document.getElementById("status");
  const say = (m) => status.textContent = m;

  const STYLES = {
    Aurora: { grad: ["#38E0FF", "#B36BFF"], ring: "url(#g)", letter: "url(#g)", dot: "#FFC24B" },
    Ink:    { ring: "#ECEDF5", letter: "#ECEDF5", dot: "#38E0FF" },
    Gold:   { ring: "#F5C453", letter: "#F5C453", dot: "#FF8FA3" },
    Neon:   { ring: "#FF3D8B", letter: "#38E0FF", dot: "#FF3D8B" }
  };
  const SHAPES = ["Kreis", "Sechseck", "Quadrat"];
  let style = "Aurora", shape = "Kreis";

  function frameMarkup(shape, color) {
    const attr = 'class="ring" pathLength="1" fill="none" stroke="' + color + '" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"';
    if (shape === "Kreis") return '<circle ' + attr + ' cx="200" cy="200" r="168"/>';
    if (shape === "Quadrat") return '<rect ' + attr + ' x="44" y="44" width="312" height="312" rx="44"/>';
    // Sechseck
    let pts = [];
    for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 90); pts.push((200 + 176 * Math.cos(a)).toFixed(1) + "," + (200 + 176 * Math.sin(a)).toFixed(1)); }
    return '<polygon ' + attr + ' points="' + pts.join(" ") + '"/>';
  }

  function badgeSVG(animated) {
    const raw = (document.getElementById("txt").value || "KM").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3) || "KM";
    const s = STYLES[style];
    const L = raw.length;
    const size = L <= 1 ? 200 : (L === 2 ? 150 : 112);
    const defs = s.grad ? ('<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + s.grad[0] + '"/><stop offset="1" stop-color="' + s.grad[1] + '"/></linearGradient></defs>') : "";
    const dotY = shape === "Quadrat" ? 356 : 360;
    return '<svg class="' + (animated ? "anim" : "") + '" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">' +
      defs +
      frameMarkup(shape, s.ring) +
      '<g class="letters"><text x="200" y="205" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="' + size + '" ' +
        'letter-spacing="' + (L >= 2 ? -4 : 0) + '" fill="' + s.letter + '">' + raw + '</text></g>' +
      '<circle class="dot" cx="200" cy="' + dotY + '" r="9" fill="' + s.dot + '"/>' +
      '</svg>';
  }

  function render() { badge.innerHTML = badgeSVG(true); }

  function currentInitials() { return (document.getElementById("txt").value || "KM").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3) || "KM"; }

  // build chips
  const stylesEl = document.getElementById("styles");
  Object.keys(STYLES).forEach((k, i) => {
    const b = document.createElement("button"); b.className = "chip" + (i === 0 ? " on" : ""); b.textContent = k;
    b.addEventListener("click", () => { style = k; [...stylesEl.children].forEach(c => c.classList.toggle("on", c === b)); render(); });
    stylesEl.appendChild(b);
  });
  const shapesEl = document.getElementById("shapes");
  SHAPES.forEach((k, i) => {
    const b = document.createElement("button"); b.className = "chip" + (i === 0 ? " on" : ""); b.textContent = k;
    b.addEventListener("click", () => { shape = k; [...shapesEl.children].forEach(c => c.classList.toggle("on", c === b)); render(); });
    shapesEl.appendChild(b);
  });

  document.getElementById("txt").addEventListener("input", render);
  document.getElementById("replay").addEventListener("click", render);

  // export helpers (use static, fully-drawn SVG)
  function staticSVGString(px) {
    const str = badgeSVG(false).replace("<svg ", '<svg width="' + px + '" height="' + px + '" ');
    return str;
  }
  document.getElementById("svg").addEventListener("click", () => {
    const blob = new Blob([staticSVGString(400)], { type: "image/svg+xml" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "monogramm-" + currentInitials() + ".svg"; a.click();
    say("SVG gespeichert — voll skalierbar, perfekt als Logo.");
  });
  document.getElementById("png").addEventListener("click", () => {
    const px = 1024;
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(staticSVGString(px));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = px; c.height = px;
      c.getContext("2d").drawImage(img, 0, 0, px, px);
      const a = document.createElement("a"); a.href = c.toDataURL("image/png");
      a.download = "monogramm-" + currentInitials() + ".png"; a.click();
      say("PNG gespeichert (1024×1024, transparenter Hintergrund).");
    };
    img.onerror = () => say("Export hat nicht geklappt — versuch es mit SVG.");
    img.src = url;
  });

  render();
})();
</script>
</body>
</html>
