<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Wallpaper-Generator</title>
<style>
  :root { --ink:#F3F4FB; --muted:#9BA0BE; --faint:#565C82; --line:rgba(255,255,255,0.12);
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#06060F; color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden; touch-action:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }
  .ui { position:fixed; inset:0; z-index:2; pointer-events:none; }
  .top { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:20px 24px; }
  .brand { font-weight:800; font-size:18px; letter-spacing:-0.02em; }
  .brand b { background:linear-gradient(100deg,#38E0FF,#B36BFF,#FFC24B); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .back { pointer-events:auto; font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:40px; padding:9px 15px; text-decoration:none; transition:.2s; }
  .back:hover { color:var(--ink); border-color:#38E0FF; }
  .title { position:absolute; top:70px; left:50%; transform:translateX(-50%); text-align:center; width:min(520px,92vw); }
  .title .label { font-family:var(--mono); font-size:11px; letter-spacing:0.26em; text-transform:uppercase; color:#38E0FF; }
  .title h1 { font-size:clamp(20px,4.6vw,28px); font-weight:800; letter-spacing:-0.02em; margin-top:6px; }
  .kit { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:min(720px,94vw); pointer-events:auto;
    background:rgba(12,13,22,0.72); border:1px solid var(--line); border-radius:18px; padding:14px 16px; backdrop-filter:blur(14px); display:flex; flex-direction:column; gap:11px; }
  .krow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cap { font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); width:58px; flex:0 0 58px; }
  .chip { font-family:var(--mono); font-size:12px; color:var(--muted); background:rgba(255,255,255,0.045); border:1px solid var(--line); border-radius:30px; padding:8px 13px; cursor:pointer; transition:.18s; white-space:nowrap; }
  .chip:hover { color:var(--ink); }
  .chip.on { color:#06060F; background:linear-gradient(100deg,#38E0FF,#B36BFF); border-color:transparent; font-weight:700; }
  .grow { flex:1; }
  .btn { font-family:var(--mono); font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:40px; padding:11px 16px; cursor:pointer; transition:.2s; white-space:nowrap; }
  .btn:hover { color:var(--ink); border-color:rgba(255,255,255,0.28); }
  .btn.primary { color:#06060F; background:linear-gradient(100deg,#38E0FF,#B36BFF); border:none; font-weight:700; }
  .status { font-family:var(--mono); font-size:11px; color:var(--faint); min-height:14px; }
  @media (max-width:560px){ .cap{width:100%; flex-basis:100%;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top"><div class="brand">khan<b>motari</b></div><a class="back" href="../index.html">‹ Zurück</a></div>
  <div class="title"><div class="label">Wallpaper-Generator</div><h1>Abstrakte Kunst als Hintergrund</h1></div>
  <div class="kit">
    <div class="krow"><span class="cap">Stil</span><div id="styles" class="krow grow"></div></div>
    <div class="krow"><span class="cap">Farbe</span><div id="hues" class="krow grow"></div><button id="variant" class="btn">↻ Variante</button></div>
    <div class="krow"><span class="cap">Format</span><div id="formats" class="krow"></div><span class="grow"></span><button id="dl" class="btn primary">↓ Wallpaper speichern</button></div>
    <div class="status" id="status">Maus/Finger bewegen verändert das Feld. Wähl Format &amp; speichere in voller Auflösung.</div>
  </div>
</div>
<script>
(function(){
  "use strict";
  const cv=document.getElementById("c");
  const gl=cv.getContext("webgl")||cv.getContext("experimental-webgl");
  const status=document.getElementById("status"); const say=m=>status.textContent=m;
  if(!gl){ say("Dein Browser unterstützt kein WebGL."); return; }

  const VERT="attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }";
  const COMMON=[
    "precision highp float;",
    "uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse; uniform float u_hue; uniform float u_seed;",
    "vec3 hueShift(vec3 c,float a){ vec3 k=vec3(0.57735); float ca=cos(a); return c*ca+cross(k,c)*sin(a)+k*dot(k,c)*(1.0-ca); }"
  ].join("\n");
  const FRAG_AURORA=COMMON+"\n"+[
    "float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }",
    "float noise(vec2 p){ vec2 i=floor(p),f=fract(p); float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.)); vec2 u=f*f*(3.-2.*f); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }",
    "float fbm(vec2 p){ float v=0.,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.; a*=0.5; } return v; }",
    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;",
    " vec2 sv=uv+u_seed; vec2 m=(u_mouse-0.5*u_res)/u_res.y;",
    " float t=u_time*0.05+u_seed;",
    " vec2 q=vec2(fbm(sv+t), fbm(sv+vec2(5.2,1.3)-t));",
    " vec2 r=vec2(fbm(sv+3.5*q+vec2(1.7,9.2)+t*1.2), fbm(sv+3.5*q+vec2(8.3,2.8)-t));",
    " float f=fbm(sv+3.5*r);",
    " float md=length(uv-m); f+=0.16*sin(md*10.-u_time*2.)*exp(-md*2.8);",
    " vec3 col=mix(vec3(0.02,0.03,0.11), vec3(0.13,0.85,1.0), clamp(f*1.5,0.,1.));",
    " col=mix(col, vec3(0.66,0.34,1.0), clamp(pow(f,2.0)*1.3,0.,1.));",
    " col=mix(col, vec3(1.0,0.78,0.32), clamp(pow(f,3.4)*1.5,0.,1.));",
    " col+=0.04/(abs(f-0.62)+0.06)*vec3(0.2,0.45,0.95);",
    " col*=smoothstep(1.7,0.1,length(uv));",
    " col=hueShift(col,u_hue); col=pow(clamp(col,0.,1.3),vec3(0.92));",
    " gl_FragColor=vec4(col,1.0); }"
  ].join("\n");
  const FRAG_HYPER=COMMON+"\n"+[
    "mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }",
    "vec3 pal(float t){ return 0.5+0.5*cos(6.28318*(vec3(1.0)*t+vec3(0.10,0.42,0.78))); }",
    "float map(vec3 p){ p.xy*=rot(p.z*0.14+u_time*0.10+u_seed); float s=2.4; vec3 q=p*s; float g=abs(dot(sin(q),cos(q.zxy)))/s-0.05; return g*0.55; }",
    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y; vec2 m=(u_mouse-0.5*u_res)/u_res.y;",
    " vec3 ro=vec3(0.,0.,u_time*1.25+u_seed*4.0); vec3 rd=normalize(vec3(uv+m*0.5,1.0));",
    " float t=0.,glow=0.,d=0.;",
    " for(int i=0;i<70;i++){ vec3 p=ro+rd*t; d=map(p); glow+=0.020/(1.0+d*d*42.0); if(d<0.001||t>26.0) break; t+=d; }",
    " vec3 col=vec3(0.02,0.03,0.08);",
    " col+=pal(t*0.045+u_time*0.02)*glow; col+=pal(0.16)*(glow*glow*0.12);",
    " col*=exp(-t*0.055); col*=smoothstep(1.55,0.12,length(uv));",
    " col=hueShift(col,u_hue); col=pow(clamp(col,0.,1.5),vec3(0.90));",
    " gl_FragColor=vec4(col,1.0); }"
  ].join("\n");

  const FRAGS=[FRAG_AURORA,FRAG_HYPER];
  const STYLES=["Aurora","Hyperspace"];
  const HUES=[["Original",0],["Warm",1.2],["Kühl",3.0],["Pink",4.6],["Gift",5.5]];
  const FORMATS=[["Handy",1080,1920],["Desktop",1920,1080],["Quadrat",1080,1080]];
  let styleIdx=0, hue=0, seed=0, fmtIdx=0;

  function sh(g,t,src){ const o=g.createShader(t); g.shaderSource(o,src); g.compileShader(o); if(!g.getShaderParameter(o,g.COMPILE_STATUS)){ console.error(g.getShaderInfoLog(o)); return null; } return o; }
  function setup(g,frag){
    const vs=sh(g,g.VERTEX_SHADER,VERT), fs=sh(g,g.FRAGMENT_SHADER,frag); if(!vs||!fs) return null;
    const p=g.createProgram(); g.attachShader(p,vs); g.attachShader(p,fs); g.linkProgram(p);
    if(!g.getProgramParameter(p,g.LINK_STATUS)) return null; g.useProgram(p);
    const b=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,b); g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
    const lp=g.getAttribLocation(p,"p"); g.enableVertexAttribArray(lp); g.vertexAttribPointer(lp,2,g.FLOAT,false,0,0);
    return { u:{ res:g.getUniformLocation(p,"u_res"), time:g.getUniformLocation(p,"u_time"), mouse:g.getUniformLocation(p,"u_mouse"), hue:g.getUniformLocation(p,"u_hue"), seed:g.getUniformLocation(p,"u_seed") } };
  }

  let cur=setup(gl,FRAGS[styleIdx]);
  const scale=Math.min(window.devicePixelRatio||1,1.25);
  const mo={x:0,y:0,tx:0,ty:0};
  function resize(){ const w=innerWidth,h=innerHeight; cv.width=Math.floor(w*scale); cv.height=Math.floor(h*scale); cv.style.width=w+"px"; cv.style.height=h+"px"; gl.viewport(0,0,cv.width,cv.height); if(mo.tx===0){ mo.x=mo.tx=cv.width/2; mo.y=mo.ty=cv.height/2; } }
  window.addEventListener("resize",resize); resize();
  window.addEventListener("pointermove",e=>{ mo.tx=e.clientX*scale; mo.ty=(innerHeight-e.clientY)*scale; });

  const start=performance.now(); let curTime=0;
  function frame(now){ curTime=(now-start)/1000; mo.x+=(mo.tx-mo.x)*0.07; mo.y+=(mo.ty-mo.y)*0.07;
    gl.uniform2f(cur.u.res,cv.width,cv.height); gl.uniform1f(cur.u.time,curTime); gl.uniform2f(cur.u.mouse,mo.x,mo.y); gl.uniform1f(cur.u.hue,hue); gl.uniform1f(cur.u.seed,seed);
    gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);

  // chips
  function chips(host, arr, getLabel, onPick, activeIdx){
    arr.forEach((it,i)=>{ const b=document.createElement("button"); b.className="chip"+(i===activeIdx?" on":""); b.textContent=getLabel(it);
      b.addEventListener("click",()=>{ [...host.children].forEach(c=>c.classList.toggle("on",c===b)); onPick(i,it); }); host.appendChild(b); });
  }
  chips(document.getElementById("styles"),STYLES,s=>s,(i)=>{ styleIdx=i; cur=setup(gl,FRAGS[i]); },0);
  chips(document.getElementById("hues"),HUES,h=>h[0],(i,it)=>{ hue=it[1]; },0);
  chips(document.getElementById("formats"),FORMATS,f=>f[0],(i)=>{ fmtIdx=i; },0);
  document.getElementById("variant").addEventListener("click",()=>{ seed=Math.random()*12; say("Neue Variante generiert."); });

  document.getElementById("dl").addEventListener("click",()=>{
    const [name,w,h]=FORMATS[fmtIdx];
    const ec=document.createElement("canvas"); ec.width=w; ec.height=h;
    const eg=ec.getContext("webgl",{preserveDrawingBuffer:true})||ec.getContext("experimental-webgl",{preserveDrawingBuffer:true});
    if(!eg){ say("Export nicht möglich auf diesem Gerät."); return; }
    const s=setup(eg,FRAGS[styleIdx]); if(!s){ say("Export fehlgeschlagen."); return; }
    eg.viewport(0,0,w,h);
    eg.uniform2f(s.u.res,w,h); eg.uniform1f(s.u.time,curTime); eg.uniform2f(s.u.mouse,w/2,h/2); eg.uniform1f(s.u.hue,hue); eg.uniform1f(s.u.seed,seed);
    eg.drawArrays(eg.TRIANGLES,0,3);
    const o=document.createElement("canvas"); o.width=w; o.height=h; const g=o.getContext("2d");
    g.drawImage(ec,0,0);
    g.font="600 "+Math.round(w*0.014)+"px ui-monospace, monospace"; g.textAlign="right"; g.textBaseline="alphabetic"; g.fillStyle="rgba(255,255,255,0.45)";
    g.fillText("khanmotari", w-Math.round(w*0.03), h-Math.round(w*0.03));
    const a=document.createElement("a"); a.href=o.toDataURL("image/png"); a.download="wallpaper-"+name.toLowerCase()+".png"; a.click();
    say("Wallpaper gespeichert · "+name+" ("+w+"×"+h+").");
  });
})();
</script>
</body>
</html>
