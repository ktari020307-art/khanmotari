name: Deploy to GitHub Pages

# Manual-only: run this from the Actions tab AFTER enabling Pages with
# Source = "GitHub Actions" in Settings. (Auto-enable via the workflow token
# is blocked by GitHub for the initial Pages setup.)
on:
  workflow_dispatch:

# Allow the workflow to enable Pages and publish to it
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repository (index.html + pieces/)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
