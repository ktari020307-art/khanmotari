<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Self-Drawing Mark</title>
<style>
  :root {
    --ground: #F1F2F4;
    --panel: #FFFFFF;
    --ink: #16181D;
    --muted: #6A6E78;
    --faint: #A9adb6;
    --cobalt: #2F6BFF;
    --coral: #FF5D46;
    --line: #E4E6EA;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(140% 100% at 50% -10%, #FFFFFF, var(--ground) 70%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .card {
    width: min(560px, 92vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 56px 40px 40px;
    box-shadow: 0 30px 80px -40px rgba(20,22,30,0.35);
    text-align: center;
    position: relative;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 28px;
  }

  .mark { width: 200px; height: 200px; margin: 0 auto; display: block; }

  .mark .ring-bg { fill: none; stroke: var(--line); stroke-width: 2; }

  .mark [data-draw] {
    fill: none;
    stroke: var(--ink);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 0.9s ease forwards;
  }
  .mark .ring-draw {
    stroke: var(--cobalt);
    stroke-width: 4;
    animation-duration: 1.3s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* stagger */
  .mark .ring-draw { animation-delay: 0.1s; }
  .mark .k-stem    { animation-delay: 0.55s; }
  .mark .k-arm-up  { animation-delay: 0.85s; }
  .mark .k-arm-dn  { animation-delay: 1.05s; }
  .mark .m-poly    { animation-delay: 1.25s; animation-duration: 1.1s; }

  /* rotating dashed accent ring — continuous life */
  .mark .orbit {
    fill: none;
    stroke: var(--coral);
    stroke-width: 3;
    stroke-dasharray: 3 12;
    stroke-linecap: round;
    opacity: 0;
    transform-origin: 180px 180px;
    animation: orbit-in 0.6s ease 1.9s forwards, orbit-spin 14s linear infinite;
  }
  @keyframes orbit-in { to { opacity: 1; } }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  .mark .dot {
    fill: var(--coral);
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) 1.75s forwards;
  }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }

  .wordmark {
    margin-top: 34px;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 750;
    letter-spacing: -0.02em;
  }
  .wordmark .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.3em);
    animation: rise 0.6s ease forwards;
    animation-delay: calc(2s + var(--i) * 0.04s);
  }
  .wordmark .accent { color: var(--cobalt); }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .tagline {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: rise 0.8s ease forwards;
    animation-delay: 2.5s;
  }

  .replay {
    margin-top: 34px;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 40px;
    padding: 10px 20px; cursor: pointer;
    opacity: 0; animation: rise 0.8s ease forwards; animation-delay: 2.9s;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .replay:hover { border-color: var(--cobalt); color: var(--cobalt); background: rgba(47,107,255,0.05); }
  .replay svg { width: 14px; height: 14px; }

  .card.replaying [data-draw] { animation: none; stroke-dashoffset: 1; }
  .card.replaying .dot { animation: none; opacity: 0; }
  .card.replaying .orbit { animation: orbit-spin 14s linear infinite; opacity: 0; }
  .card.replaying .ch,
  .card.replaying .tagline { animation: none; opacity: 0; transform: translateY(0.3em); }

  @media (prefers-reduced-motion: reduce) {
    .mark [data-draw] { animation: none; stroke-dashoffset: 0; }
    .mark .dot, .mark .orbit { animation: none; opacity: 1; }
    .wordmark .ch, .tagline, .replay { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <p class="eyebrow">Identity · Self-Drawing Mark</p>

  <svg class="mark" viewBox="0 0 360 360" role="img" aria-label="khanmotari Monogramm">
    <circle class="ring-bg" cx="180" cy="180" r="150"/>
    <!-- outer accent ring draws in -->
    <circle class="ring-draw" data-draw pathLength="1" cx="180" cy="180" r="150"/>
    <!-- K -->
    <path class="k-stem"   data-draw pathLength="1" d="M118 120 L118 240"/>
    <path class="k-arm-up" data-draw pathLength="1" d="M118 182 L168 120"/>
    <path class="k-arm-dn" data-draw pathLength="1" d="M118 182 L170 240"/>
    <!-- M -->
    <path class="m-poly"   data-draw pathLength="1" d="M185 240 L185 120 L215 186 L245 120 L245 240"/>
    <!-- accent dot -->
    <circle class="dot" cx="262" cy="240" r="9"/>
    <!-- rotating dashed orbit -->
    <circle class="orbit" cx="180" cy="180" r="168"/>
  </svg>

  <h1 class="wordmark" id="wordmark" aria-label="khanmotari"></h1>
  <p class="tagline">Motion · Design · Code</p>

  <button class="replay" id="replay" aria-label="Animation neu abspielen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg>
    Replay
  </button>
</div>

<script>
  const WORD = "khanmotari";
  const wm = document.getElementById("wordmark");
  [...WORD].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (i < 2 ? " accent" : ""); // highlight the "kh"
    s.textContent = c;
    s.style.setProperty("--i", i);
    wm.appendChild(s);
  });

  const card = document.getElementById("card");
  document.getElementById("replay").addEventListener("click", () => {
    card.classList.add("replaying");
    void card.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove("replaying")));
  });
</script>
</body>
</html>
