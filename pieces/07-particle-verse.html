<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Particle Verse</title>
<style>
  :root {
    --bg: #06060F;
    --ink: #F3F4FB;
    --muted: #9BA0BE;
    --faint: #565C82;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; display: block; z-index: 0; }

  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 42%, transparent 45%, rgba(4,4,12,0.72) 100%);
  }

  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  .brand {
    position: absolute; top: 30px; left: 30px;
    opacity: 0; animation: fade 1.4s ease 0.4s forwards;
  }
  .brand .name { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .brand .name b {
    background: linear-gradient(100deg, #38E0FF, #B36BFF, #FFC24B);
    -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800;
  }
  .brand .tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--faint); margin-top: 6px;
  }

  .headline {
    position: absolute; left: 0; right: 0; bottom: 128px; text-align: center;
    opacity: 0; animation: fade 1.6s ease 0.9s forwards;
  }
  .headline h1 {
    font-size: clamp(13px, 2.1vw, 17px); font-weight: 500; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .headline h1 b { color: var(--ink); font-weight: 700; }

  .dock {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    display: flex; gap: 8px; pointer-events: auto;
    padding: 8px; border-radius: 46px;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(10px);
    opacity: 0; animation: fade 1.2s ease 1.6s forwards;
  }
  .dock button {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); background: transparent; border: none; cursor: pointer;
    padding: 11px 18px; border-radius: 40px; transition: color .2s, background .2s;
    white-space: nowrap;
  }
  .dock button:hover { color: var(--ink); }
  .dock button.on { color: #06060F; background: linear-gradient(100deg, #38E0FF, #B36BFF); }
  .dock .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: rgba(255,255,255,0.12); }

  .hint {
    position: absolute; right: 30px; top: 32px; text-align: right;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--faint);
    opacity: 0; animation: fade 1.2s ease 2s forwards; line-height: 1.7;
  }

  @keyframes fade { to { opacity: 1; } }

  @media (max-width: 560px) {
    .dock button { padding: 10px 12px; font-size: 11px; }
    .headline { bottom: 108px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>

<div class="ui">
  <div class="brand">
    <div class="name">khan<b>motari</b></div>
    <div class="tag">Particle Verse</div>
  </div>

  <div class="hint">Maus bewegen · Klick = Explosion</div>

  <div class="headline">
    <h1><b id="phaseName">khanmotari</b> — aus tausenden Partikeln geformt</h1>
  </div>

  <div class="dock">
    <button id="bForm" class="on">Form</button>
    <button id="bFlow">Flow</button>
    <button id="bNext">Next ›</button>
    <span class="sep"></span>
    <button id="bBurst">Burst</button>
    <button id="bAuto" class="on">Auto ▶</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d", { alpha: false });

  let W = 0, H = 0, dpr = 1;
  const TAU = Math.PI * 2;

  // ---- scenes (text that the particles spell out) ----
  const SCENES = ["khanmotari", "MOTION", "∞"];
  let sceneTargets = [];   // per scene: array of {x,y}
  let P = 0;               // particle count
  let particles = [];

  const mouse = { x: -9999, y: -9999, active: false };

  // ---- state machine ----
  let mode = "form";       // "form" | "flow"
  let currentScene = 0;
  let auto = true;

  const PHASES = [
    { mode: "flow", dur: 2600 },
    { mode: "form", scene: 0, dur: 4200 },
    { mode: "flow", dur: 2400 },
    { mode: "form", scene: 1, dur: 3600 },
    { mode: "flow", dur: 2400 },
    { mode: "form", scene: 2, dur: 3400 }
  ];
  let phaseIndex = 1;      // start on the brand form
  let phaseStart = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Fit a font size so the text spans most of the width
  function fitFont(g, text, maxW, maxH) {
    let size = Math.min(maxW * 0.19, maxH * 0.42);
    for (let k = 0; k < 8; k++) {
      g.font = "900 " + size + "px " + getComputedStyle(document.body).fontFamily;
      const w = g.measureText(text).width;
      if (w > maxW * 0.9) size *= (maxW * 0.9) / w; else break;
    }
    return size;
  }

  // Sample the pixels of each scene's rendered text into target points
  function buildScenes() {
    const tmp = document.createElement("canvas");
    tmp.width = Math.max(1, Math.floor(W));
    tmp.height = Math.max(1, Math.floor(H));
    const g = tmp.getContext("2d");
    const step = W < 640 ? 5 : 4;   // sampling density (smaller = more points)

    sceneTargets = SCENES.map((text) => {
      g.clearRect(0, 0, tmp.width, tmp.height);
      const size = fitFont(g, text, W, H);
      g.font = "900 " + size + "px " + getComputedStyle(document.body).fontFamily;
      g.fillStyle = "#fff";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(text, W / 2, H / 2);

      const img = g.getImageData(0, 0, tmp.width, tmp.height).data;
      const pts = [];
      for (let y = 0; y < tmp.height; y += step) {
        for (let x = 0; x < tmp.width; x += step) {
          const a = img[(y * tmp.width + x) * 4 + 3];
          if (a > 128) pts.push({ x: x, y: y });
        }
      }
      shuffle(pts);
      return pts.length ? pts : [{ x: W / 2, y: H / 2 }];
    });
  }

  function assignTargets(sceneIdx) {
    const pts = sceneTargets[sceneIdx];
    const n = pts.length;
    for (let i = 0; i < P; i++) {
      const p = pts[(i * n / P) | 0];
      particles[i].tx = p.x + (Math.random() - 0.5) * 2.2;
      particles[i].ty = p.y + (Math.random() - 0.5) * 2.2;
    }
  }

  // Smooth pseudo flow-field angle (cheap, no external noise lib)
  function flowAngle(x, y, t) {
    const s = 0.0016;
    const v = Math.sin(x * s + t)
            + Math.cos(y * s - t * 0.8)
            + Math.sin((x + y) * s * 0.7 + t * 0.5);
    return v * 1.9;
  }

  function makeParticles() {
    P = Math.max(700, Math.min(3200, Math.floor((W * H) / 900)));
    if (W < 640) P = Math.min(P, 1500);
    particles = new Array(P);
    for (let i = 0; i < P; i++) {
      const hue = 176 + (i / P) * 150;              // cyan → violet → magenta
      const gold = Math.random() < 0.08;            // a few gold "stars"
      particles[i] = {
        x: Math.random() * W, y: Math.random() * H,
        vx: 0, vy: 0, tx: W / 2, ty: H / 2,
        hue: gold ? 44 : hue,
        sat: gold ? 95 : 85,
        li: gold ? 62 : 58,
        sz: gold ? 1.7 : 1.3
      };
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    makeParticles();
    buildScenes();
    assignTargets(currentScene);
    // paint solid background once
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#06060F";
    ctx.fillRect(0, 0, W, H);
  }

  // ---- interaction ----
  window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  window.addEventListener("pointerleave", () => { mouse.active = false; });
  window.addEventListener("pointerdown", (e) => burst(e.clientX, e.clientY, 9));

  function burst(cx, cy, power) {
    for (let i = 0; i < P; i++) {
      const p = particles[i];
      const dx = p.x - cx, dy = p.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 260) {
        const f = (1 - d / 260) * power;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
  }

  // ---- controls ----
  const bForm = document.getElementById("bForm");
  const bFlow = document.getElementById("bFlow");
  const bNext = document.getElementById("bNext");
  const bBurst = document.getElementById("bBurst");
  const bAuto = document.getElementById("bAuto");
  const phaseName = document.getElementById("phaseName");

  function setModeUI() {
    bForm.classList.toggle("on", mode === "form");
    bFlow.classList.toggle("on", mode === "flow");
    bAuto.classList.toggle("on", auto);
    phaseName.textContent = mode === "form" ? SCENES[currentScene] : "· flow ·";
  }
  function manual() { auto = false; setModeUI(); }

  bForm.addEventListener("click", () => { manual(); mode = "form"; assignTargets(currentScene); setModeUI(); });
  bFlow.addEventListener("click", () => { manual(); mode = "flow"; setModeUI(); });
  bNext.addEventListener("click", () => { manual(); currentScene = (currentScene + 1) % SCENES.length; mode = "form"; assignTargets(currentScene); setModeUI(); });
  bBurst.addEventListener("click", () => { burst(W / 2, H / 2, 16); });
  bAuto.addEventListener("click", () => { auto = !auto; if (auto) { phaseIndex = -1; phaseStart = 0; } setModeUI(); });

  function applyPhase(now) {
    const p = PHASES[phaseIndex];
    mode = p.mode;
    if (p.mode === "form") { currentScene = p.scene; assignTargets(currentScene); }
    phaseStart = now;
    setModeUI();
  }

  // ---- main loop ----
  let t = 0;
  function frame(now) {
    t += 0.006;

    if (auto) {
      if (phaseStart === 0 || now - phaseStart > PHASES[(phaseIndex + PHASES.length) % PHASES.length].dur) {
        phaseIndex = (phaseIndex + 1) % PHASES.length;
        applyPhase(now);
      }
    }

    // fade previous frame → motion trails
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(6,6,15,0.13)";
    ctx.fillRect(0, 0, W, H);

    // additive glow for particles
    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < P; i++) {
      const p = particles[i];
      let ax = 0, ay = 0;

      if (mode === "form") {
        ax += (p.tx - p.x) * 0.028;
        ay += (p.ty - p.y) * 0.028;
        // tiny shimmer so the letters breathe
        ax += Math.cos(t * 2 + i) * 0.06;
        ay += Math.sin(t * 2 + i) * 0.06;
      } else {
        const a = flowAngle(p.x, p.y, t);
        ax += Math.cos(a) * 0.9;
        ay += Math.sin(a) * 0.9;
      }

      // mouse repulsion
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d = Math.hypot(dx, dy);
        if (d < 130) {
          const f = (1 - d / 130) * 4.2;
          ax += (dx / (d || 1)) * f;
          ay += (dy / (d || 1)) * f;
        }
      }

      p.vx = (p.vx + ax) * (mode === "form" ? 0.82 : 0.90);
      p.vy = (p.vy + ay) * (mode === "form" ? 0.82 : 0.90);
      p.x += p.vx; p.y += p.vy;

      // wrap in flow mode so the field stays full
      if (mode === "flow") {
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }

      const speed = Math.min(Math.hypot(p.vx, p.vy), 6);
      const li = p.li + speed * 4;

      // soft halo
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + li + "%,0.16)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * 2.6, 0, TAU); ctx.fill();
      // bright core
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + Math.min(li + 12, 92) + "%,0.9)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, TAU); ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  // ---- boot ----
  resize();
  window.addEventListener("resize", resize);
  setModeUI();

  if (reduce) {
    // static: gather the brand word once, no animation
    mode = "form"; currentScene = 0; assignTargets(0);
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < P; i++) {
      const p = particles[i];
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + p.li + "%,0.9)";
      ctx.beginPath(); ctx.arc(p.tx, p.ty, p.sz, 0, TAU); ctx.fill();
    }
    phaseName.textContent = SCENES[0];
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
