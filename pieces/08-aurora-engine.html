<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Aurora Engine</title>
<style>
  :root {
    --ink: #F3F4FB;
    --muted: #AEB2CE;
    --faint: #6A6F93;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #05060E;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(3,4,10,0.55) 100%);
  }

  .stage { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; pointer-events: none; text-align: center; }
  .stage .word {
    font-weight: 800; letter-spacing: -0.04em; line-height: 1;
    font-size: clamp(52px, 13vw, 168px);
    color: #fff;
    text-shadow: 0 4px 60px rgba(0,0,0,0.45), 0 0 2px rgba(0,0,0,0.3);
    opacity: 0; transform: translateY(14px) scale(0.98);
    animation: rise 1.8s cubic-bezier(.2,.7,.2,1) 0.3s forwards;
  }
  .stage .word .ch { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(0.3em);
    animation: focus 1s ease forwards; animation-delay: calc(0.5s + var(--i) * 0.05s); }
  .stage .tag {
    margin-top: 22px; font-family: var(--mono); font-size: clamp(11px, 1.6vw, 14px);
    letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: rise 1.4s ease 1.4s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes focus { to { opacity: 1; filter: blur(0); transform: translateY(0); } }

  .brand { position: fixed; top: 28px; left: 30px; z-index: 3;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
    opacity: 0; animation: rise 1.2s ease 0.4s forwards; }
  .hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 3;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--faint);
    opacity: 0; animation: rise 1.2s ease 2.2s forwards; }
  .badge { position: fixed; top: 28px; right: 30px; z-index: 3;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #05060E; font-weight: 700; background: linear-gradient(100deg,#37E0FF,#B36BFF);
    padding: 5px 11px; border-radius: 20px;
    opacity: 0; animation: rise 1.2s ease 0.6s forwards; }

  .fallback { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; text-align: center; padding: 24px;
    background: linear-gradient(135deg,#0a0b18,#1a1030); }
  .fallback.show { display: grid; }

  @media (prefers-reduced-motion: reduce) {
    .stage .word, .stage .word .ch, .stage .tag, .brand, .hint, .badge {
      animation: none !important; opacity: 1 !important; filter: none !important; transform: none !important;
    }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="veil"></div>

<div class="brand">Aurora Engine · WebGL</div>
<div class="badge">✦ GPU Shader</div>

<div class="stage">
  <div>
    <div class="word" id="word" aria-label="khanmotari"></div>
    <div class="tag">Motion · rendered on the GPU</div>
  </div>
</div>

<div class="hint" id="hint">Maus bewegen — das Feld folgt dir</div>

<div class="fallback" id="fallback">
  <div>
    <h1 style="font-size:40px;font-weight:800;letter-spacing:-0.03em;">khanmotari</h1>
    <p style="color:#AEB2CE;margin-top:12px;font-family:var(--mono);font-size:13px;">
      Dein Browser unterstützt kein WebGL — aber die anderen Stücke laufen trotzdem.
    </p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // build wordmark
  const word = document.getElementById("word");
  [..."khanmotari"].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch"; s.textContent = c; s.style.setProperty("--i", i);
    word.appendChild(s);
  });

  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) { document.getElementById("fallback").classList.add("show"); return; }

  const VERT = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";

  const FRAG = [
    "precision highp float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform vec2 u_mouse;",
    "",
    "float hash(vec2 p){",
    "  p = fract(p * vec2(123.34, 456.21));",
    "  p += dot(p, p + 45.32);",
    "  return fract(p.x * p.y);",
    "}",
    "float noise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  float a = hash(i);",
    "  float b = hash(i + vec2(1.0, 0.0));",
    "  float c = hash(i + vec2(0.0, 1.0));",
    "  float d = hash(i + vec2(1.0, 1.0));",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);",
    "}",
    "float fbm(vec2 p){",
    "  float v = 0.0, a = 0.5;",
    "  for(int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.0; a *= 0.5; }",
    "  return v;",
    "}",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;",
    "  vec2 m  = (u_mouse - 0.5 * u_res) / u_res.y;",
    "  float t = u_time * 0.06;",
    "",
    "  // domain warping for organic flow",
    "  vec2 q = vec2(fbm(uv + t), fbm(uv + vec2(5.2, 1.3) - t));",
    "  vec2 r = vec2(fbm(uv + 3.5 * q + vec2(1.7, 9.2) + t * 1.2),",
    "               fbm(uv + 3.5 * q + vec2(8.3, 2.8) - t));",
    "  float f = fbm(uv + 3.5 * r);",
    "",
    "  // mouse ripple",
    "  float md = length(uv - m);",
    "  f += 0.22 * sin(md * 11.0 - u_time * 2.2) * exp(-md * 2.6);",
    "",
    "  // cosmic palette: deep -> cyan -> violet -> gold",
    "  vec3 col = mix(vec3(0.02, 0.03, 0.11), vec3(0.13, 0.85, 1.00), clamp(f * 1.55, 0.0, 1.0));",
    "  col = mix(col, vec3(0.66, 0.34, 1.00), clamp(pow(f, 2.0) * 1.35, 0.0, 1.0));",
    "  col = mix(col, vec3(1.00, 0.78, 0.32), clamp(pow(f, 3.4) * 1.6, 0.0, 1.0));",
    "",
    "  // glowing filaments",
    "  col += 0.05 / (abs(f - 0.62) + 0.05) * vec3(0.20, 0.45, 0.95);",
    "",
    "  // vignette + tone",
    "  col *= smoothstep(1.35, 0.15, length(uv));",
    "  col = pow(clamp(col, 0.0, 1.3), vec3(0.92));",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }

  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { document.getElementById("fallback").classList.add("show"); return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.getElementById("fallback").classList.add("show"); return; }
  gl.useProgram(prog);

  // full-screen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, "u_res");
  const uTime = gl.getUniformLocation(prog, "u_time");
  const uMouse = gl.getUniformLocation(prog, "u_mouse");

  let scale = Math.min(window.devicePixelRatio || 1, 1.5);
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * scale);
    canvas.height = Math.floor(h * scale);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (mouse.tx === 0 && mouse.ty === 0) { mouse.x = mouse.tx = canvas.width / 2; mouse.y = mouse.ty = canvas.height / 2; }
  }
  window.addEventListener("resize", resize);
  resize();

  window.addEventListener("pointermove", (e) => {
    mouse.tx = e.clientX * scale;
    mouse.ty = (window.innerHeight - e.clientY) * scale; // flip Y for GL
  });

  const start = performance.now();
  function frame(now) {
    // ease mouse for silky motion
    mouse.x += (mouse.tx - mouse.x) * 0.08;
    mouse.y += (mouse.ty - mouse.y) * 0.08;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, (now - start) / 1000);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (!reduce) requestAnimationFrame(frame);
  }

  if (reduce) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, 12.0);
    gl.uniform2f(uMouse, canvas.width / 2, canvas.height / 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    document.getElementById("hint").style.display = "none";
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
