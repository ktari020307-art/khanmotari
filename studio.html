<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khanmotari — Name Studio</title>
<style>
  :root {
    --ink: #F3F4FB; --muted: #9BA0BE; --faint: #565C82;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #06060F; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .brand b { background: linear-gradient(100deg,#38E0FF,#B36BFF,#FFC24B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .back { pointer-events: auto; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid rgba(255,255,255,0.12); border-radius: 40px; padding: 9px 16px; transition: .2s; text-decoration: none; }
  .back:hover { color: var(--ink); border-color: #38E0FF; }

  .panel { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); width: min(520px, 92vw); pointer-events: auto; text-align: center; }
  .panel .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #38E0FF; margin-bottom: 12px; }
  .field { display: flex; gap: 8px; }
  .field input {
    flex: 1; font-family: var(--sans); font-size: 18px; font-weight: 600; color: var(--ink);
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 15px 18px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #38E0FF; }
  .field input::placeholder { color: var(--faint); font-weight: 500; }

  .dock { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  .dock button {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 18px; border-radius: 40px; cursor: pointer; transition: .2s; backdrop-filter: blur(8px); white-space: nowrap;
  }
  .dock button:hover { color: var(--ink); border-color: rgba(255,255,255,0.25); }
  .dock button.primary { color: #06060F; background: linear-gradient(100deg,#38E0FF,#B36BFF); border: none; font-weight: 700; }

  .follow { position: absolute; bottom: 26px; right: 26px; pointer-events: auto; }
  .follow a { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 40px; padding: 12px 18px; transition: .2s; }
  .follow a:hover { color: var(--ink); border-color: #B36BFF; }

  @media (max-width: 560px) { .follow { display: none; } .panel { top: 66px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <div class="top">
    <div class="brand">khan<b>motari</b></div>
    <a class="back" href="index.html">‹ Zurück</a>
  </div>

  <div class="panel">
    <div class="label">Dein Name in Bewegung</div>
    <div class="field">
      <input id="txt" type="text" maxlength="16" value="khanmotari" placeholder="Tipp deinen Namen…" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="dock">
    <button id="scatter">Explodieren</button>
    <button id="color">Farbe</button>
    <button id="dl" class="primary">↓ Als Bild speichern</button>
  </div>

  <div class="follow"><a href="index.html#connect">khanmotari folgen ›</a></div>
</div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d", { alpha: false });
  const TAU = Math.PI * 2;

  let W = 0, H = 0, scale = 1;
  let P = 0, particles = [], targets = [];
  let text = "khanmotari";
  const mouse = { x: -9999, y: -9999, active: false };

  const PALETTES = [
    [[56,224,255],[179,107,255],[255,194,75]],   // aurora
    [[255,61,139],[56,224,255],[255,61,139]],     // neon
    [[74,222,155],[255,106,61],[168,85,247]],     // mint
    [[255,214,120],[255,120,80],[255,60,140]]     // sunset
  ];
  let palIdx = 0;

  function colorAt(t) {
    const P3 = PALETTES[palIdx];
    const seg = t < 0.5 ? 0 : 1;
    const local = t < 0.5 ? t * 2 : (t - 0.5) * 2;
    const a = P3[seg], b = P3[seg + 1];
    return [
      Math.round(a[0] + (b[0]-a[0]) * local),
      Math.round(a[1] + (b[1]-a[1]) * local),
      Math.round(a[2] + (b[2]-a[2]) * local)
    ];
  }

  function fitFont(g, t, maxW, maxH) {
    let size = Math.min(maxW * 0.2, maxH * 0.4);
    for (let k = 0; k < 8; k++) {
      g.font = "800 " + size + "px " + getComputedStyle(document.body).fontFamily;
      const w = g.measureText(t).width;
      if (w > maxW * 0.86) size *= (maxW * 0.86) / w; else break;
    }
    return size;
  }

  function buildTargets() {
    const tmp = document.createElement("canvas");
    tmp.width = Math.max(1, Math.floor(W));
    tmp.height = Math.max(1, Math.floor(H));
    const g = tmp.getContext("2d");
    const label = (text && text.trim()) ? text.trim() : "khanmotari";
    const size = fitFont(g, label, W, H);
    g.font = "800 " + size + "px " + getComputedStyle(document.body).fontFamily;
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(label, W / 2, H / 2);
    const img = g.getImageData(0, 0, tmp.width, tmp.height).data;
    const step = W < 640 ? 5 : 4;
    const pts = [];
    for (let y = 0; y < tmp.height; y += step)
      for (let x = 0; x < tmp.width; x += step)
        if (img[(y * tmp.width + x) * 4 + 3] > 128) pts.push({ x, y });
    targets = pts.length ? pts : [{ x: W/2, y: H/2 }];
    assign();
  }

  function assign() {
    const n = targets.length;
    for (let i = 0; i < P; i++) {
      const p = targets[(i * n / P) | 0];
      particles[i].tx = p.x + (Math.random()-0.5) * 2;
      particles[i].ty = p.y + (Math.random()-0.5) * 2;
    }
  }

  function makeParticles() {
    P = Math.max(800, Math.min(3600, Math.floor((W * H) / 850)));
    if (W < 640) P = Math.min(P, 1700);
    particles = new Array(P);
    for (let i = 0; i < P; i++) {
      particles[i] = { x: Math.random()*W, y: Math.random()*H, vx: 0, vy: 0, tx: W/2, ty: H/2,
        c: i / P, gold: Math.random() < 0.06 };
    }
  }

  function resize() {
    scale = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * scale); cv.height = Math.floor(H * scale);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    makeParticles(); buildTargets();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#06060F"; ctx.fillRect(0, 0, W, H);
  }

  function burst(cx, cy, power) {
    for (let i = 0; i < P; i++) {
      const p = particles[i];
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
      if (d < 320) { const f = (1 - d/320) * power; p.vx += dx/d*f; p.vy += dy/d*f; }
    }
  }

  let perfNow = 0;
  function frame(now) {
    perfNow = now || 0;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(6,6,15,0.14)"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < P; i++) {
      const p = particles[i];
      let ax = (p.tx - p.x) * 0.03, ay = (p.ty - p.y) * 0.03;
      ax += Math.cos(perfNow * 0.002 + i) * 0.05;
      ay += Math.sin(perfNow * 0.002 + i) * 0.05;
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 120) { const f = (1 - d/120) * 4; ax += dx/(d||1)*f; ay += dy/(d||1)*f; }
      }
      p.vx = (p.vx + ax) * 0.84; p.vy = (p.vy + ay) * 0.84;
      p.x += p.vx; p.y += p.vy;

      const disp = Math.hypot(p.x - p.tx, p.y - p.ty);
      const t = Math.min(disp / 46, 1);
      const rad = 1.3 + t * 3;
      let col;
      if (p.gold) col = [255, 200, 90]; else col = colorAt(p.c);
      const light = 0.28 + t * 0.72;
      ctx.fillStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (light * 0.4) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, rad * 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + light + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, TAU); ctx.fill();
    }

    // live watermark (so screenshots/recordings carry the brand)
    ctx.globalCompositeOperation = "source-over";
    ctx.font = "600 12px " + "ui-monospace, monospace";
    ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillText("khanmotari", W - 18, H - 16);

    if (!reduce) requestAnimationFrame(frame);
  }

  // input
  const input = document.getElementById("txt");
  let deb;
  input.addEventListener("input", () => {
    clearTimeout(deb);
    deb = setTimeout(() => { text = input.value; buildTargets(); }, 220);
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { text = input.value; buildTargets(); input.blur(); } });

  // pointer
  window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  window.addEventListener("pointerleave", () => { mouse.active = false; });
  cv.addEventListener("pointerdown", (e) => burst(e.clientX, e.clientY, 11));

  // controls
  document.getElementById("scatter").addEventListener("click", () => burst(W/2, H/2, 17));
  document.getElementById("color").addEventListener("click", () => { palIdx = (palIdx + 1) % PALETTES.length; });
  document.getElementById("dl").addEventListener("click", () => {
    const ex = document.createElement("canvas");
    ex.width = cv.width; ex.height = cv.height;
    const g = ex.getContext("2d");
    g.drawImage(cv, 0, 0);
    g.font = "600 " + Math.round(cv.width * 0.017) + "px ui-monospace, monospace";
    g.textAlign = "right"; g.textBaseline = "alphabetic"; g.fillStyle = "rgba(255,255,255,0.82)";
    g.fillText("made with khanmotari", cv.width - 26, cv.height - 26);
    const safe = (text || "name").trim().replace(/[^a-z0-9]/gi, "-").toLowerCase() || "name";
    const a = document.createElement("a");
    a.href = ex.toDataURL("image/png"); a.download = "khanmotari-" + safe + ".png"; a.click();
  });

  // boot
  resize();
  window.addEventListener("resize", resize);

  if (reduce) {
    // static formed frame
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < P; i++) {
      const p = particles[i]; const col = p.gold ? [255,200,90] : colorAt(p.c);
      ctx.fillStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0.9)";
      ctx.beginPath(); ctx.arc(p.tx, p.ty, 1.4, 0, TAU); ctx.fill();
    }
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
